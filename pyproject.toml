[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fractal-application"
version = "1.2.0"
description = "The top of the Fractal stack: the application context that installs an application's repositories and services, wires its command bus and event publisher, and health-checks them on startup."
readme = "README.md"
authors = [
    { name = "Douwe van der Meij", email = "douwe@karibu-online.nl" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["application context", "dependency injection", "ddd", "clean architecture", "fastapi"]

dependencies = [
    "fractal-core",
    "fractal-commands",
    "fractal-events",
]

[project.optional-dependencies]
fastapi = [
    "fastapi",
    "pydantic",
    "sentry-sdk",
    "fractal-roles",
    "fractal-tokens",
]
gcp = [
    "google-cloud-firestore",
    "google-cloud-pubsub",
    "fractal-repositories",
]
processes = [
    "fractal-processes",
]
dev = [
    "fastapi",
    "pydantic",
    "sentry-sdk",
    "fractal-roles",
    "fractal-tokens",
    "fractal-repositories",
    "google-cloud-firestore",
    "google-cloud-pubsub",
    "httpx",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "isort>=5.13.2",
]

[project.urls]
Homepage = "https://github.com/Fractal-Forge/fractal-application"
Documentation = "https://github.com/Fractal-Forge/fractal-application#readme"
Repository = "https://github.com/Fractal-Forge/fractal-application"
Issues = "https://github.com/Fractal-Forge/fractal-application/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=fractal_application --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise AssertionError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "def __repr__",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "I"]
ignore = [
    "E501",  # Line too long (let Black handle it)
    "C901",  # Ignore complexity warnings
    "F403",  # Allow star imports in __init__.py files
    "F405",  # Allow undefined exports from star imports
]

[tool.ruff.lint.per-file-ignores]
# contrib/ came over from fractal-toolkit as integration glue for FastAPI and
# Google Cloud, and it is checked here mainly to prove the rename was complete.
# B008 is FastAPI's own idiom — Depends() in an argument default is how the
# framework declares dependencies, not a mistake. B009 is a runtime attribute
# lookup that reads better spelled out at the site.
"fractal_application/contrib/**" = ["B008", "B009"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
strict_optional = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# Same reasoning as the ruff ignores above: this is extracted integration code
# against libraries with loose or namespace-package typing (google.cloud,
# fastapi dependency defaults). Typing it properly is worth doing, but as its
# own change rather than smuggled into an extraction.
module = "fractal_application.contrib.*"
ignore_errors = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
